# compose.yaml
# Shared database services for every lab in the project.
#
# - One container and data directory per database engine. Database files are
#   bind-mounted into ./data (git-ignored).
# - Each shared-service lab creates and uses its own database inside this
#   instance. Lab 4 also uses this file, with separate PostgreSQL master and
#   slave services because physical replication requires two clusters.
# - Managed through ./scripts/db-*.sh or `docker compose`; labs must not start
#   their own containers.

name: ards

services:
  postgres:
    image: postgres:14
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (copy .env.example first)}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      # Comma-separated databases created by the init script on a fresh cluster.
      POSTGRES_DATABASES: ${POSTGRES_DATABASES:-optimization_db}
    ports:
      # Bind to localhost only: the database is not exposed to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Bind mount: the cluster lives inside the repository and is git-ignored.
      # Stop the container before copying this directory.
      - ${POSTGRES_DATA_DIR:-./data/postgres}:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env (copy .env.example first)}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-demo_db}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - ${MYSQL_DATA_DIR:-./data/mysql}:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  master:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LAB4_MASTER_PASSWORD:-masterpass}
      POSTGRES_DB: ${LAB4_DATABASE:-replication_db}
    ports:
      - "127.0.0.1:${LAB4_MASTER_PORT:-55432}:5432"
    volumes:
      - lab4_master_data:/var/lib/postgresql/data
    networks:
      - lab4_replication
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${LAB4_DATABASE:-replication_db}"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 10s

  slave:
    image: postgres:14
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LAB4_SLAVE_PASSWORD:-slavepass}
      POSTGRES_DB: ${LAB4_DATABASE:-replication_db}
    ports:
      - "127.0.0.1:${LAB4_SLAVE_PORT:-55433}:5432"
    volumes:
      - lab4_slave_data:/var/lib/postgresql/data
    networks:
      - lab4_replication
    depends_on:
      master:
        condition: service_healthy

networks:
  lab4_replication:
    name: ards-lab4-replication

volumes:
  lab4_master_data:
  lab4_slave_data:
